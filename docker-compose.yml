services:
  # WhatsApp HTTP API (Waha) — WhatsApp bridge
  waha:
    image: devlikeapro/waha:latest
    platform: linux/amd64
    container_name: akka-waha
    restart: unless-stopped
    ports:
      - "3001:3000"
    environment:
      - WAHA_DASHBOARD_ENABLED=true
      - WAHA_DASHBOARD_USERNAME=admin
      - WAHA_DASHBOARD_PASSWORD=
      - WAHA_DASHBOARD_NO_PASSWORD=true
      - WHATSAPP_HOOK_URL=http://akka:3000/webhook
      - WHATSAPP_HOOK_EVENTS=*
      - WAHA_SWAGGER_ENABLED=true
      - WAHA_API_KEY=waha-api-key-2024
      - WAHA_NO_API_KEY=false
      - WHATSAPP_DEFAULT_ENGINE=NOWEB
      - WHATSAPP_NOWEB_STORE_ENABLED=true
      - WHATSAPP_NOWEB_STORE_FULL_SYNC=false
      - WHATSAPP_START_SESSION=default
      - WHATSAPP_RESTART_ALL_SESSIONS=true
      - PUPPETEER_ARGS=--no-sandbox,--disable-setuid-sandbox,--disable-dev-shm-usage,--disable-gpu
    volumes:
      - ./data/waha:/app/data
      - ./data/waha/sessions:/app/.sessions
    shm_size: 2gb
    cap_add:
      - SYS_ADMIN

  # Akka Platform — WhatsApp automation server
  akka:
    image: ghcr.io/snailsquid/akka:latest
    container_name: akka
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - PORT=3000
      - WAHA_BASE_URL=http://waha:3000
      - WAHA_API_KEY=waha-api-key-2024
      - WAHA_WEBHOOK_URL=http://akka:3000/api/sessions/{session}/webhook
    volumes:
      - akka-data:/app/data
    depends_on:
      waha:
        condition: service_started

volumes:
  akka-data:
    name: akka-data
