name: Build & Deploy

on:
  push:
    branches: [main]

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          cat >> ~/.ssh/config << 'CONF'
          Host hetzner
            HostName ${{ secrets.SSH_HOST }}
            User ${{ secrets.SSH_USER }}
            Port 22
            IdentityFile ~/.ssh/id_ed25519
            StrictHostKeyChecking accept-new
          CONF
          chmod 600 ~/.ssh/config

      - name: Verify SSH
        run: ssh hetzner "docker info --format 'Server: {{.ServerVersion}}' && docker compose version"

      - name: Deploy
        run: |
          ssh hetzner bash -s << 'DEPLOY'
          set -euo pipefail

          DEPLOY_DIR="/root/akka"
          REPO_URL="https://github.com/snailsquid/_akka.git"
          BUILD_DIR="/tmp/akka-build"

          echo "=== Creating deploy directory ==="
          mkdir -p "$DEPLOY_DIR/data/waha/sessions"

          echo "=== Cloning latest code ==="
          rm -rf "$BUILD_DIR"
          git clone --depth 1 --branch main "$REPO_URL" "$BUILD_DIR"
          cd "$BUILD_DIR"

          echo "=== Building Docker image ==="
          docker build -t akka:latest .

          echo "=== Copying compose file ==="
          cp docker-compose.yml "$DEPLOY_DIR/docker-compose.yml"

          echo "=== Deploying ==="
          cd "$DEPLOY_DIR"
          docker compose up -d --remove-orphans

          echo "=== Services ==="
          docker compose ps --format 'table {{.Name}}\t{{.Status}}\t{{.Ports}}'

          echo "=== Cleanup ==="
          rm -rf "$BUILD_DIR"
          DEPLOY

      - name: Health check
        run: |
          sleep 10
          echo "=== Health check ==="
          ssh hetzner "curl -sf http://localhost:3000/ 2>&1 || echo 'FAILED'"
          echo ""
          echo "=== Akka logs (last 10) ==="
          ssh hetzner "docker logs akka --tail 10 2>&1 || echo 'No logs'"
          echo ""
          echo "=== WAHA status ==="
          ssh hetzner "docker inspect akka-waha --format '{{.State.Status}}' 2>/dev/null || echo 'WAHA not found'"
