name: Build & Deploy

on:
  push:
    branches: [main]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # ── Build & push Docker image ──────────────────────
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=,format=short

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # ── SSH to Hetzner & deploy ────────────────────────
      - name: Install cloudflared (SSH tunnel)
        run: |
          curl -fsSL https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64 \
            -o /usr/local/bin/cloudflared
          chmod +x /usr/local/bin/cloudflared

      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          cat >> ~/.ssh/config << 'CONF'
          Host hetzner
            HostName ${{ secrets.SSH_HOST }}
            User ${{ secrets.SSH_USER }}
            Port 22
            ProxyCommand cloudflared access ssh --hostname %h
            IdentityFile ~/.ssh/id_ed25519
            StrictHostKeyChecking accept-new
          CONF
          chmod 600 ~/.ssh/config

      - name: Verify SSH
        run: ssh hetzner "docker info --format 'Server: {{.ServerVersion}}' && docker compose version"

      - name: Copy deployment files to server
        run: |
          ssh hetzner "mkdir -p /root/akka/data/waha/sessions"
          scp docker-compose.yml hetzner:/root/akka/docker-compose.yml

      - name: Pull & deploy
        run: |
          # GHCR credentials (expanded by Actions runner before SSH)
          GHCR_USER="${{ github.actor }}"
          GHCR_PASS="${{ secrets.GITHUB_TOKEN }}"

          ssh hetzner "cd /root/akka && \
            echo '$GHCR_PASS' | docker login ghcr.io -u '$GHCR_USER' --password-stdin && \
            docker compose pull && \
            docker compose up -d --remove-orphans && \
            echo '=== Services ===' && \
            docker compose ps --format 'table {{.Name}}\t{{.Status}}\t{{.Ports}}'"

      - name: Health check
        run: |
          sleep 10
          echo "=== Akka health check ==="
          ssh hetzner "curl -sf http://localhost:3000/ 2>&1 || echo 'FAILED'"
          echo ""
          echo "=== Akka logs (last 10 lines) ==="
          ssh hetzner "docker logs akka --tail 10 2>&1 || echo 'Container not running'"
          echo ""
          echo "=== WAHA status ==="
          ssh hetzner "docker inspect akka-waha --format '{{.State.Status}}' 2>/dev/null || echo 'Container not found'"
